name: Release

# Push a tag `vX.Y.Z` to publish a GitHub release. The tag must equal the version in the root
# package.json (bump it in a PR first: `pnpm version:set 1.2.0`, docs/deploy.md → Releases). The notes
# are generated from the commit subjects since the previous tag (scripts/release-notes.mjs).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the history and the previous tag
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: The tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version (and merge it) before tagging."
            exit 1
          fi
      - name: Generate release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
